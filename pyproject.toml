[project]
name = "agentaudit"
version = "0.1.0"
description = "Test suite for onchain agent execution. Find out which guarantees actually hold."
requires-python = ">=3.10"
dependencies = ["web3>=7,<8", "eth-tester[py-evm]"]

[project.optional-dependencies]
keeperhub = []
dev = ["pytest"]

[project.scripts]
agentaudit = "agentaudit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agentaudit"]
